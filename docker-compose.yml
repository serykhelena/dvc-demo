version: '3.8'

services:
  test-minio:
      image: minio/minio:RELEASE.2025-02-18T16-25-55Z-cpuv1
      restart: unless-stopped
      ports:
        - "9090:9000"
        - "9091:9001"
      volumes:
        - ./minio:/data
      env_file:
        - .env
      command: server /data --console-address ":9001"
      logging:
        options:
          max-file: "5"
          max-size: "20m"
